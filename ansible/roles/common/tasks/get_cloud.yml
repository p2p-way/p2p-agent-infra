# Common - Get cloud
- name: Identify cloud
  ansible.builtin.command: cloud-init query cloud-name
  register: common_cloud
  changed_when: false

- name: Compute variables
  ansible.builtin.set_fact:
    common_cloud: >-
      {% if common_cloud.stdout == 'gce' -%}
        gcp
      {%- elif common_cloud.stdout == 'oracle' -%}
        oci
      {%- elif common_cloud.stdout != '' -%}
        {{ common_cloud.stdout }}
      {%- else -%}
        unknown-cloud
      {%- endif %}
