# Common - Apt
- name: Compute variables
  ansible.builtin.set_fact:
    common_unattended_upgrades_exist: >-
      {% if ansible_facts['services']['unattended-upgrades'] | default('') | length > 0 -%}
        {{ true | bool }}
      {%- else -%}
        {{ false | bool }}
      {%- endif %}

- name: Disable and stop unattended-upgrades service
  ansible.builtin.systemd_service:
    enabled: false
    state: stopped
    name: unattended-upgrades
  when: common_unattended_upgrades_exist

- name: Check for unattended-upgrade proccesses
  ansible.builtin.shell: |
    set -o pipefail
    ps aux | grep -v grep | grep "unattended-upgrade$" || true
  args:
    executable: bash
  register: common_unattended_upgrade_processes
  changed_when: false
  when: common_unattended_upgrades_exist

- name: Kill unattended-upgrade proccesses
  ansible.builtin.shell: |
    set -o pipefail
    killall unattended-upgrade || true
  args:
    executable: bash
  register: common_unattended_upgrade_processes
  changed_when: false
  when: common_unattended_upgrade_processes.stdout | default('') != ''

- name: Disable updates in config
  ansible.builtin.copy:
    content: |
      // APT::Periodic::Update-Package-Lists "0";
      // APT::Periodic::Unattended-Upgrade "0";
    dest: /etc/apt/apt.conf.d/99z-config
    mode: '644'
    owner: '{{ base_user }}'
    group: '{{ base_group }}'

- name: Check apt
  ansible.builtin.command: apt install -y
  register: common_apt_status
  changed_when: false
  ignore_errors: true

- name: Fix interrupted packages installation
  ansible.builtin.command: dpkg --configure -a
  changed_when: false
  failed_when: false
  when: common_apt_status.stderr is search('dpkg --configure')
