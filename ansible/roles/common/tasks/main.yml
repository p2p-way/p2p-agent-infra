# Common
- name: Create base folder
  ansible.builtin.file:
    path: '{{ base_folder }}'
    state: directory
    mode: '755'
    owner: '{{ base_user }}'
    group: '{{ base_group }}'

- name: Create temp folder
  ansible.builtin.file:
    path: '{{ temp_folder }}'
    state: directory
    mode: '777'
    owner: '{{ base_user }}'
    group: '{{ base_group }}'
  when: temp_folder is not exists

- name: Gather service facts
  ansible.builtin.service_facts:
  when: ansible_facts['services'] | default([]) | length == 0

- name: Apt tasks
  ansible.builtin.include_tasks:
    file: apt.yml

- name: Update cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 86400

- name: Install dependencies
  ansible.builtin.apt:
    name: acl
    state: present

- name: Setup firewall
  ansible.builtin.include_tasks:
    file: firewall.yml

- name: Get meta
  ansible.builtin.include_tasks:
    file: get_meta.yml

- name: Get cloud
  ansible.builtin.include_tasks:
    file: get_cloud.yml
  when: common_cloud is undefined

- name: Get region
  ansible.builtin.include_tasks:
    file: get_region.yml
  when: common_region is undefined

- name: Get public IPv4
  ansible.builtin.include_tasks:
    file: get_public_ipv4.yml
  when: common_public_ipv4 is undefined

- name: Get public IPv6
  ansible.builtin.include_tasks:
    file: get_public_ipv6.yml
  when: common_public_ipv6 is undefined

- name: Show cloud, region and public IP
  ansible.builtin.debug:
    msg: |
      Cloud:       {{ common_cloud }}
      Region:      {{ common_region }}
      Public IPv4: {{ common_public_ipv4 }}
      Public IPv6: {{ common_public_ipv6 }}
