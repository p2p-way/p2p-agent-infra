# Common
- name: Create base folder
  ansible.builtin.file:
    path: '{{ base_folder }}'
    state: directory
    mode: '755'
    owner: '{{ base_user }}'
    group: '{{ base_group }}'

- name: Create temp folder
  ansible.builtin.file:
    path: '{{ temp_folder }}'
    state: directory
    mode: '777'
    owner: '{{ base_user }}'
    group: '{{ base_group }}'
  when: temp_folder is not exists

- name: Gather service facts
  ansible.builtin.service_facts:
  when: ansible_facts['services'] | default([]) | length == 0

- name: Apt tasks
  ansible.builtin.include_tasks:
    file: apt.yml

- name: Update cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 86400

- name: Install dependencies
  ansible.builtin.apt:
    name: acl
    state: present

- name: Get cloud
  ansible.builtin.include_tasks:
    file: get_cloud.yml

- name: Get region
  ansible.builtin.include_tasks:
    file: get_region.yml

- name: Get public IP
  ansible.builtin.include_tasks:
    file: get_public_ip.yml

- name: Setup firewall
  ansible.builtin.include_tasks:
    file: firewall.yml
