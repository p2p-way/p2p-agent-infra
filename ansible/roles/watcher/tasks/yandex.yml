# Yandex - Management
- name: Check for Yandex Cloud CLI
  ansible.builtin.command: which yc
  register: watcher_yc_cli
  changed_when: false
  failed_when: false

- name: Install Yandex Cloud CLI
  ansible.builtin.shell: |
    set -o pipefail
    curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -n -i /usr/local
  args:
    executable: bash
  changed_when: false
  when: watcher_yc_cli.stdout == ''

- name: Update autoscaler
  ansible.builtin.shell: |
    set -o pipefail

    # Variables
    desired_capacity_cc={{ watcher_desired_capacity }}

    # Get metadata
    instance_group=$(curl -s -H "Metadata-Flavor: Google" http://169.254.169.254/computeMetadata/v1/instance/vendor/labels/instance-group)

    # Check if scaling is required
    desired_capacity_current=$(yc compute instance-group \
      get "${instance_group}" \
      --jq .scale_policy.fixed_scale.size)

    scaling_drift="${desired_capacity_current} --> ${desired_capacity_cc}"

    if [[ -n "${desired_capacity_current}" ]]; then
      if [[ ${desired_capacity_current} -eq ${desired_capacity_cc} ]]; then
        echo "Skip scaling agent instances: ${scaling_drift}"
        exit 0
      fi
    fi

    # Update autoscaler
    yc compute instance-group \
      update "${instance_group}" \
      --async \
      --scale-policy-fixed-scale-size "${desired_capacity_cc}"

    # Check scaling status
    if [[ $? -eq 0 ]]; then
      echo "Scaling agent instances successful: ${scaling_drift}"
    else
      echo "Scaling agent instances failed: ${scaling_drift}"
    fi
  args:
    executable: bash
  register: watcher_autoscaler
  changed_when: false

- name: Show autoscaler output
  ansible.builtin.debug:
    msg: |
      {{ item }}:
      {% for out in item | extract(watcher_autoscaler) %}
      {{ out }}
      {% endfor %}
  loop:
    - stdout_lines
    - stderr_lines
